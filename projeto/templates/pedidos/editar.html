<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Pedido</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }

        form {
            background: white;
            padding: 25px;
            border-radius: 10px;
            max-width: 750px;
            margin: auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 { text-align: center; margin-bottom: 20px; }

        label { font-weight: bold; display: block; margin-top: 10px; }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button[type="submit"] {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }

        button[type="submit"]:hover { background: #0056b3; }

        .secao {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            background: #fafafa;
        }

        .secao h3 {
            margin-top: 0;
            border-bottom: 1px solid #ddd;
            padding-bottom: 8px;
        }

        .item-linha {
            display: grid;
            grid-template-columns: 1fr 1fr 80px 120px 1fr 130px 80px;
            gap: 8px;
            align-items: end;
            margin-bottom: 10px;
            background: white;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #e0e0e0;
        }

        .item-linha label { font-size: 12px; margin-top: 0; }
        .item-linha input, .item-linha select { margin-bottom: 0; padding: 7px; font-size: 13px; }

        .btn-remover {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 10px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }

        .btn-remover:hover { background: #b02a37; }

        .btn-add-item {
            background: #007bff;
            color: white;
            border: none;
            padding: 9px 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 5px;
        }

        #total-display {
            font-size: 18px;
            font-weight: bold;
            color: #28a745;
            text-align: right;
            margin-top: 10px;
        }

        .voltar {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #007bff;
            text-decoration: none;
        }
    </style>
</head>
<body>

<form method="POST" id="form-pedido">

    <h2>Editar Pedido #{{ pedido.numero_pedido }}</h2>

    <div class="secao">
        <h3>Dados do Pedido</h3>

        <label>ID do Pedido</label>
        <input type="text" name="id" value="{{ pedido.id }}" readonly style="background:#eee;">

        <label>Número do Pedido (para cozinha)</label>
        <input type="number" name="numero_pedido" value="{{ pedido.numero_pedido }}" required>

        <label>Data e Hora</label>
        <input type="datetime-local" name="data_hora" value="{{ pedido.data_hora }}" required>

        <label>Mesa</label>
        <input type="text" name="mesa" value="{{ pedido.mesa }}" required>

        <label>Cliente</label>
        <input type="text" name="cliente" value="{{ pedido.cliente }}" required>

        <label>Garçom Responsável</label>
        <input type="text" name="garcom" value="{{ pedido.garcom }}" required>

        <label>Status do Pedido</label>
        <select name="status">
            {% for s in ['Pendente', 'Em Preparação', 'Pronto', 'Entregue'] %}
            <option {% if pedido.status == s %}selected{% endif %}>{{ s }}</option>
            {% endfor %}
        </select>

        <label>Observações Especiais</label>
        <textarea name="observacoes" rows="2">{{ pedido.observacoes }}</textarea>
    </div>

    <div class="secao">
        <h3>Itens do Pedido</h3>
        <div id="lista-itens"></div>
        <button type="button" class="btn-add-item" onclick="adicionarItem()">+ Adicionar Item</button>
        <div id="total-display">Total: R$ 0,00</div>
        <input type="hidden" name="itens_json" id="itens_json">
    </div>

    <button type="submit">Salvar Alterações</button>
</form>

<a href="/pedidos" class="voltar">← Voltar para lista de pedidos</a>

<div id="dados-itens" data-itens="{{ pedido.itens | tojson | e }}" style="display:none;"></div>

<script>
    // Itens já salvos vindos do servidor
    const itensExistentes = JSON.parse(document.getElementById('dados-itens').dataset.itens);
    let contadorItem = 0;

    function adicionarItem(dado) {
        contadorItem++;
        const id = contadorItem;
        const d = dado || {};
        const div = document.createElement('div');
        div.className = 'item-linha';
        div.id = 'item-' + id;

        const statusOpts = ['Pendente','Em Preparação','Pronto']
            .map(s => `<option ${(d.status_item||'Pendente')===s?'selected':''}>${s}</option>`)
            .join('');

        div.innerHTML = `
            <div>
                <label>ID Item</label>
                <input type="text" id="id_item_${id}" value="${d.id_item||'ITEM'+String(id).padStart(3,'0')}">
            </div>
            <div>
                <label>Prato</label>
                <input type="text" id="prato_${id}" value="${d.prato||''}" oninput="calcularTotal()">
            </div>
            <div>
                <label>Qtd</label>
                <input type="number" id="qtd_${id}" value="${d.quantidade||1}" min="1" oninput="calcularTotal()">
            </div>
            <div>
                <label>Preço Unit.</label>
                <input type="number" id="preco_${id}" step="0.01" value="${d.preco_unitario||''}" oninput="calcularTotal()">
            </div>
            <div>
                <label>Observações</label>
                <input type="text" id="obs_item_${id}" value="${d.observacoes_item||''}">
            </div>
            <div>
                <label>Status</label>
                <select id="status_item_${id}">${statusOpts}</select>
            </div>
            <div>
                <label>&nbsp;</label>
                <button type="button" class="btn-remover" onclick="removerItem(${id})">Remover</button>
            </div>
        `;
        document.getElementById('lista-itens').appendChild(div);
        calcularTotal();
    }

    function removerItem(id) {
        const el = document.getElementById('item-' + id);
        if (el) el.remove();
        calcularTotal();
    }

    function calcularTotal() {
        let total = 0;
        for (let i = 1; i <= contadorItem; i++) {
            if (!document.getElementById('item-' + i)) continue;
            const qtd   = parseFloat(document.getElementById('qtd_'   + i)?.value) || 0;
            const preco = parseFloat(document.getElementById('preco_' + i)?.value) || 0;
            total += qtd * preco;
        }
        document.getElementById('total-display').textContent =
            'Total: R$ ' + total.toFixed(2).replace('.', ',');
    }

    document.getElementById('form-pedido').addEventListener('submit', function(e) {
        const itens = [];
        for (let i = 1; i <= contadorItem; i++) {
            if (!document.getElementById('item-' + i)) continue;
            const prato = document.getElementById('prato_' + i).value.trim();
            if (!prato) continue;
            itens.push({
                id_item:          document.getElementById('id_item_'    + i).value.trim(),
                prato:            prato,
                quantidade:       parseInt(document.getElementById('qtd_'      + i).value) || 1,
                preco_unitario:   parseFloat(document.getElementById('preco_'  + i).value) || 0,
                observacoes_item: document.getElementById('obs_item_'  + i).value.trim(),
                status_item:      document.getElementById('status_item_'+ i).value
            });
        }
        if (itens.length === 0) {
            e.preventDefault();
            alert('Adicione pelo menos um item ao pedido!');
            return;
        }
        document.getElementById('itens_json').value = JSON.stringify(itens);
    });

    // Carrega itens existentes
    itensExistentes.forEach(item => adicionarItem(item));
</script>

</body>
</html>
