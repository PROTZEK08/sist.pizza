<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Pedido</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px; }
        form { background: white; padding: 25px; border-radius: 10px; max-width: 750px; margin: auto; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin-top: 10px; }
        input, textarea, select { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        input[readonly] { background: #eee; }
        button[type="submit"] { background: #28a745; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button[type="submit"]:hover { background: #218838; }
        .secao { border: 1px solid #ddd; border-radius: 8px; padding: 15px; margin-bottom: 20px; background: #fafafa; }
        .secao h3 { margin-top: 0; border-bottom: 1px solid #ddd; padding-bottom: 8px; }
        .item-linha { display: grid; grid-template-columns: 2fr 80px 1fr 80px; gap: 8px; align-items: end; margin-bottom: 10px; background: white; padding: 10px; border-radius: 6px; border: 1px solid #e0e0e0; }
        .item-linha label { font-size: 12px; margin-top: 0; }
        .item-linha input, .item-linha select { margin-bottom: 0; padding: 7px; font-size: 13px; }
        .btn-remover { background: #dc3545; color: white; border: none; padding: 8px 10px; border-radius: 5px; cursor: pointer; width: 100%; }
        .btn-remover:hover { background: #b02a37; }
        .btn-add-item { background: #007bff; color: white; border: none; padding: 9px 16px; border-radius: 5px; cursor: pointer; margin-top: 5px; }
        .btn-add-item:hover { background: #0056b3; }
        #total-display { font-size: 18px; font-weight: bold; color: #28a745; text-align: right; margin-top: 10px; }
        .voltar { display: block; text-align: center; margin-top: 15px; color: #007bff; text-decoration: none; }
    </style>
</head>
<body>

<form method="POST" id="form-pedido">
    <h2>Cadastrar Novo Pedido</h2>

    <div class="secao">
        <h3>Dados do Pedido</h3>

        <label>ID do Pedido</label>
        <input type="text" name="id" required placeholder="Ex: PED001">

        <label>Número do Pedido (para cozinha)</label>
        <input type="number" name="numero_pedido" required placeholder="Ex: 42">

        <label>Data e Hora</label>
        <input type="datetime-local" name="data_hora" id="data_hora" required readonly>

        <label>Mesa</label>
        <input type="text" name="mesa" required placeholder="Ex: Mesa 5">

        <label>Cliente</label>
        <input type="text" name="cliente" required placeholder="Nome do cliente">

        <label>Garçom Responsável</label>
        <input type="text" name="garcom" required placeholder="Nome do garçom">

        <label>Status do Pedido</label>
        <select name="status">
            <option>Pendente</option>
            <option>Em Preparação</option>
            <option>Pronto</option>
            <option>Entregue</option>
        </select>

        <label>Observações Especiais</label>
        <textarea name="observacoes" rows="2" placeholder="Ex: Sem sal, sem cebola..."></textarea>
    </div>

    <div class="secao">
        <h3>Itens do Pedido</h3>
        <div id="lista-itens"></div>
        <button type="button" class="btn-add-item" onclick="adicionarItem()">+ Adicionar Item</button>
        <div id="total-display">Total: R$ 0,00</div>
        <input type="hidden" name="itens_json" id="itens_json">
    </div>

    <button type="submit">Cadastrar Pedido</button>
</form>

<a href="/pedidos" class="voltar">← Voltar para lista de pedidos</a>

<script>
    // Pratos vindos do cardápio
    const cardapio = {{ cardapio | tojson }};
    let contadorItem = 0;

    // Preenche data/hora automaticamente
    function preencherDataHora() {
        const agora = new Date();
        const offset = agora.getTimezoneOffset() * 60000;
        const local = new Date(agora - offset);
        document.getElementById('data_hora').value = local.toISOString().slice(0, 16);
    }
    preencherDataHora();

    function adicionarItem() {
        contadorItem++;
        const id = contadorItem;
        const div = document.createElement('div');
        div.className = 'item-linha';
        div.id = 'item-' + id;

        // Monta opções do cardápio
        let opcoes = '<option value="">Selecione um prato...</option>';
        cardapio.forEach(p => {
            if (p.disponivel === 'Sim') {
                opcoes += `<option value="${p.nome}" data-preco="${p.preco}">${p.nome} - R$ ${parseFloat(p.preco).toFixed(2)}</option>`;
            }
        });

        div.innerHTML = `
            <div>
                <label>Prato</label>
                <select id="prato_${id}" onchange="selecionarPrato(${id})">${opcoes}</select>
            </div>
            <div>
                <label>Qtd</label>
                <input type="number" id="qtd_${id}" value="1" min="1" oninput="calcularTotal()">
            </div>
            <div>
                <label>Preço Unit. (R$)</label>
                <input type="number" id="preco_${id}" step="0.01" placeholder="0.00" readonly style="background:#eee;" oninput="calcularTotal()">
            </div>
            <div>
                <label>&nbsp;</label>
                <button type="button" class="btn-remover" onclick="removerItem(${id})">Remover</button>
            </div>
        `;
        document.getElementById('lista-itens').appendChild(div);
    }

    function selecionarPrato(id) {
        const select = document.getElementById('prato_' + id);
        const opt = select.options[select.selectedIndex];
        const preco = opt.getAttribute('data-preco') || 0;
        document.getElementById('preco_' + id).value = parseFloat(preco).toFixed(2);
        calcularTotal();
    }

    function removerItem(id) {
        const el = document.getElementById('item-' + id);
        if (el) el.remove();
        calcularTotal();
    }

    function calcularTotal() {
        let total = 0;
        for (let i = 1; i <= contadorItem; i++) {
            if (!document.getElementById('item-' + i)) continue;
            const qtd   = parseFloat(document.getElementById('qtd_'   + i)?.value) || 0;
            const preco = parseFloat(document.getElementById('preco_' + i)?.value) || 0;
            total += qtd * preco;
        }
        document.getElementById('total-display').textContent =
            'Total: R$ ' + total.toFixed(2).replace('.', ',');
    }

    document.getElementById('form-pedido').addEventListener('submit', function(e) {
        const itens = [];
        for (let i = 1; i <= contadorItem; i++) {
            if (!document.getElementById('item-' + i)) continue;
            const prato = document.getElementById('prato_' + i).value.trim();
            if (!prato) continue;
            itens.push({
                id_item:          'ITEM' + String(i).padStart(3, '0'),
                prato:            prato,
                quantidade:       parseInt(document.getElementById('qtd_'   + i).value) || 1,
                preco_unitario:   parseFloat(document.getElementById('preco_'+ i).value) || 0,
                observacoes_item: '',
                status_item:      'Pendente'
            });
        }
        if (itens.length === 0) {
            e.preventDefault();
            alert('Adicione pelo menos um item ao pedido!');
            return;
        }
        document.getElementById('itens_json').value = JSON.stringify(itens);
    });

    // Adiciona um item vazio ao carregar
    adicionarItem();
</script>

</body>
</html>
