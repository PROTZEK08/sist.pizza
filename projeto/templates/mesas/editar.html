<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar Mesa</title>
    <style>
        body { font-family: Arial, sans-serif; background-color:#f4f4f4; padding:20px; }
        form { background:white; padding:20px; border-radius:10px; max-width:600px; margin:auto; box-shadow:0 0 10px rgba(0,0,0,0.1); }
        label { font-weight:bold; display:block; margin-top:10px; }
        input, select { width:100%; padding:10px; margin-top:5px; margin-bottom:15px; border:1px solid #ccc; border-radius:5px; box-sizing:border-box; }
        button { background:#007bff; color:white; border:none; padding:12px; width:100%; border-radius:5px; cursor:pointer; font-size:16px; }
        button:hover { background:#0056b3; }
        .voltar { display:block; text-align:center; margin-top:15px; color:#007bff; text-decoration:none; }
    </style>
</head>
<body>
    <form method="POST">
        <h2>Editar Mesa {{ mesa.numero }}</h2>

        <label>Número da Mesa</label>
        <input type="number" name="numero" value="{{ mesa.numero }}" required>

        <label>Capacidade (pessoas)</label>
        <input type="number" name="capacidade" value="{{ mesa.capacidade }}" required>

        <label>Status</label>
        <select name="status">
            <option value="Livre" {% if mesa.status == "Livre" %}selected{% endif %}>Livre</option>
            <option value="Ocupada" {% if mesa.status == "Ocupada" %}selected{% endif %}>Ocupada</option>
            <option value="Reservada" {% if mesa.status == "Reservada" %}selected{% endif %}>Reservada</option>
        </select>

        <button type="submit">Salvar Alterações</button>
    </form>
    <a href="/mesas" class="voltar">← Voltar para lista de mesas</a>
</body>
</html>
