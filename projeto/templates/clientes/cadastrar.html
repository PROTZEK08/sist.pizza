<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Cliente</title>
    <style>
        body { font-family: Arial, sans-serif; background-color:#f4f4f4; padding:20px; }
        form { background:white; padding:20px; border-radius:10px; max-width:600px; margin:auto; box-shadow:0 0 10px rgba(0,0,0,0.1); }
        label { font-weight:bold; display:block; margin-top:10px; }
        input, textarea { width:100%; padding:10px; margin-top:5px; margin-bottom:15px; border:1px solid #ccc; border-radius:5px; box-sizing:border-box; }
        button { background:#28a745; color:white; border:none; padding:12px; width:100%; border-radius:5px; cursor:pointer; font-size:16px; }
        button:hover { background:#218838; }
        .erro { color:red; margin-bottom:10px; }
        .voltar { display:block; text-align:center; margin-top:15px; color:#007bff; text-decoration:none; }
    </style>
</head>
<body>
    <form method="POST">
        <h2>Cadastrar Novo Cliente</h2>
        {% if erro %}<p class="erro">{{ erro }}</p>{% endif %}

        <label>ID do Cliente</label>
        <input type="text" name="id" required placeholder="Ex: CLI001">

        <label>Nome Completo</label>
        <input type="text" name="nome" required placeholder="Nome do cliente">

        <label>Telefone</label>
        <input type="text" name="telefone" required placeholder="Ex: (41) 99999-9999">

        <label>Email</label>
        <input type="email" name="email" required placeholder="email@exemplo.com">

        <label>CPF (opcional)</label>
        <input type="text" name="cpf" placeholder="Ex: 000.000.000-00">

        <label>Preferências (alergias, pratos favoritos, etc.)</label>
        <textarea name="preferencias" rows="3" placeholder="Ex: Sem glúten, gosta de frutos do mar..."></textarea>

        <button type="submit">Cadastrar Cliente</button>
    </form>
    <a href="/clientes" class="voltar">← Voltar para lista de clientes</a>
</body>
</html>
